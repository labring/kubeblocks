name: Release PolarDB-PG Artifacts

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Three-part chart release version
        required: true
        default: 0.3.3
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: sigstore/cosign-installer@v3
      - name: Normalize release version
        run: echo "RELEASE_VERSION=${RELEASE_VERSION#v}" >> "$GITHUB_ENV"
      - name: Package digest-locked charts
        run: scripts/release/package-polardb-pg.sh
      - name: Sign release checksum manifest with GitHub OIDC
        run: |
          artifact_dir="dist/polardb-pg-v${RELEASE_VERSION}"
          cosign sign-blob --yes \
            --bundle "${artifact_dir}/SHA256SUMS.sigstore.json" \
            "${artifact_dir}/SHA256SUMS"
      - name: Verify checksums and rendered image references
        run: scripts/release/verify-polardb-pg-release.sh "dist/polardb-pg-v${RELEASE_VERSION}"
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: polardb-pg-v${{ env.RELEASE_VERSION }}
          path: dist/polardb-pg-v${{ env.RELEASE_VERSION }}
          if-no-files-found: error
      - name: Attach signed assets to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/polardb-pg-v${RELEASE_VERSION}/* --clobber
