{{- $cc := .Files.Get "config/pg12-config-effect-scope.yaml" | fromYaml }}
apiVersion: apps.kubeblocks.io/v1alpha1
kind: ConfigConstraint
metadata:
  name: {{ include "polardbPostgresql.componentResourceName" (dict "suffix" "postgresql12-cc" "Values" .Values) }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
spec:
  reloadOptions:
    tplScriptTrigger:
      sync: true
      scriptConfigMapRef: {{ include "polardbPostgresql.componentResourceName" (dict "suffix" "patroni-reload-script" "Values" .Values) }}
      namespace: {{ .Release.Namespace }}

  # KB 0.8 selects the Patroni leader through this Component-level selector.
  selector:
    matchLabels:
      "apps.kubeblocks.postgres.patroni/role": "master"

  dynamicActionCanBeMerged: false

  # ConfigurationSchema that impose restrictions on engine parameter's rule
  cfgSchemaTopLevelName: PGParameter
  configurationSchema:
    # schemaInJSON: auto generate from cue scripts
    # example: ../../pkg/configuration/testdata/mysql_openapi.json
    cue: |-
      {{- .Files.Get "config/pg12-config-constraint.cue" | nindent 6 }}

  ##  require db instance restart
  ## staticParameters
  {{- if hasKey $cc "staticParameters" }}
  staticParameters:
    {{- $params := get $cc "staticParameters" }}
    {{- range $params }}
    - {{ . }}
    {{- end }}
  {{- end}}

  ## define immutable parameter list, this feature is not currently supported.
  {{- if hasKey $cc "immutableParameters" }}
  immutableParameters:
   {{- $params := get $cc "immutableParameters" }}
   {{- range $params }}
    - {{ . }}
   {{- end }}
  {{- end}}

  ## configuration file format
  formatterConfig:
    format: properties
