{{- $maxSwitchoverLagBytes := int .Values.ha.switchover.maxLagBytes -}}
{{- if lt $maxSwitchoverLagBytes 0 -}}
{{- fail "ha.switchover.maxLagBytes must be greater than or equal to zero" -}}
{{- end -}}
apiVersion: apps.kubeblocks.io/v1alpha1
kind: ComponentDefinition
metadata:
  name: {{ include "polardbPostgresql.componentDefinitionName" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{ include "polardbPostgresql.componentDefinitionName" . }}: {{ include "polardbPostgresql.componentDefinitionName" . }}
    {{- include "postgresql.labels" . | nindent 4 }}
spec:
  provider: kubeblocks
  description: Patroni-based PostgreSQL HA for KubeBlocks 0.8. This addon runs Spilo/PostgreSQL, not the PolarDB-PG shared-storage engine.
  serviceKind: postgresql
  serviceVersion: 12.15.0
  replicasLimit:
    minReplicas: 2
    maxReplicas: 3
  services:
    - name: postgresql
      serviceName: postgresql
      spec:
        ports:
          - name: tcp-postgresql
            port: 5432
            targetPort: tcp-postgresql
          - name: tcp-pgbouncer
            port: 6432
            targetPort: tcp-pgbouncer
      roleSelector: primary
  updateStrategy: BestEffortParallel
  roleArbitrator: External
  volumes:
    - name: data
      needSnapshot: true
  roles:
    - name: primary
      serviceable: true
      writable: true
    - name: secondary
      serviceable: false
      writable: false
  labels:
    # KB 0.8 copies ComponentDefinition.spec.labels into the synthesized component.
    apps.kubeblocks.io/patroni-managed: "true"
    apps.kubeblocks.postgres.patroni/scope: "$(KB_CLUSTER_NAME)-$(KB_COMP_NAME)-patroni$(KB_CLUSTER_UID_POSTFIX_8)"
  logConfigs:
    {{- range $name,$pattern := .Values.logConfigs }}
    - name: {{ $name }}
      filePathPattern: {{ $pattern }}
    {{- end }}
  monitor:
    builtIn: false
    exporterConfig:
      scrapePort: http-metrics
      scrapePath: /metrics
  configs:
    - name: postgresql-configuration
      templateRef: {{ include "polardbPostgresql.componentResourceName" (dict "suffix" "postgresql12-configuration" "Values" .Values) }}
      constraintRef: {{ include "polardbPostgresql.componentResourceName" (dict "suffix" "postgresql12-cc" "Values" .Values) }}
      keys:
        - postgresql.conf
      namespace: {{ .Release.Namespace }}
      volumeName: postgresql-config
      defaultMode: 0444
    - name: {{ include "polardbPostgresql.componentResourceName" (dict "suffix" "pgbouncer-configuration" "Values" .Values) }}
      templateRef: {{ include "polardbPostgresql.componentResourceName" (dict "suffix" "pgbouncer-configuration" "Values" .Values) }}
      keys:
        - pgbouncer.ini
      namespace: {{ .Release.Namespace }}
      volumeName: pgbouncer-config
      defaultMode: 0777
    - name: postgresql-custom-metrics
      templateRef: {{ include "polardbPostgresql.componentResourceName" (dict "suffix" "postgresql12-custom-metrics" "Values" .Values) }}
      namespace: {{ .Release.Namespace }}
      volumeName: postgresql-custom-metrics
      defaultMode: 0444
  scripts:
    - name: {{ include "polardbPostgresql.componentResourceName" (dict "suffix" "scripts" "Values" .Values) }}
      templateRef: {{ include "polardbPostgresql.componentResourceName" (dict "suffix" "scripts" "Values" .Values) }}
      namespace: {{ .Release.Namespace }}
      volumeName: scripts
      defaultMode: 0555
  systemAccounts:
    - name: postgres
      initAccount: true
      passwordGenerationPolicy:
        length: 10
        numDigits: 5
        numSymbols: 0
        letterCase: MixedCases
    - name: kbadmin
      statement: CREATE USER $(USERNAME) SUPERUSER PASSWORD '$(PASSWD)';
      passwordGenerationPolicy: &defaultPasswdGenerationPolicy
        length: 10
        numDigits: 5
        numSymbols: 0
        letterCase: MixedCases
    - name: kbdataprotection
      statement: CREATE USER $(USERNAME) SUPERUSER PASSWORD '$(PASSWD)';
      passwordGenerationPolicy: *defaultPasswdGenerationPolicy
    - name: kbprobe
      statement: CREATE USER $(USERNAME) WITH PASSWORD '$(PASSWD)';  GRANT pg_monitor TO $(USERNAME);
      passwordGenerationPolicy: *defaultPasswdGenerationPolicy
    - name: kbmonitoring
      statement: CREATE USER $(USERNAME) WITH PASSWORD '$(PASSWD)';  GRANT pg_monitor TO $(USERNAME);
      passwordGenerationPolicy: *defaultPasswdGenerationPolicy
    - name: kbreplicator
      statement: CREATE USER $(USERNAME) WITH REPLICATION PASSWORD '$(PASSWD)';
      passwordGenerationPolicy: *defaultPasswdGenerationPolicy
  lifecycleActions:
    roleProbe:
      # KB 0.8 tools contains the PostgreSQL probe already. Patroni remains
      # the election authority; the manager sees the spec label above and disables
      # Lorry's separate HA loop.
      builtinHandler: postgresql
      periodSeconds: 1
      timeoutSeconds: 1
    memberJoin:
      builtinHandler: postgresql
    memberLeave:
      builtinHandler: postgresql
    readonly:
      builtinHandler: postgresql
    readwrite:
      builtinHandler: postgresql
    switchover:
      withCandidate:
        image: {{ include "postgresql.image.major12.minor150" . }}
        exec:
          command:
            - /bin/bash
            - -c
          args:
            - |
              set -euo pipefail
              endpoint="http://${KB_REPLICATION_PRIMARY_POD_FQDN}:8008"
              old_leader="${KB_REPLICATION_PRIMARY_POD_NAME}"
              candidate="${KB_SWITCHOVER_CANDIDATE_NAME}"

              transition_completed() {
                PATRONI_ENDPOINT="${endpoint}" OLD_LEADER="${old_leader}" CANDIDATE="${candidate}" python3 - <<'PY'
              import json
              import os
              import urllib.request

              with urllib.request.urlopen(os.environ["PATRONI_ENDPOINT"] + "/cluster", timeout=5) as resp:
                  members = json.load(resp).get("members", [])
              roles = {member.get("name"): str(member.get("role", "")).lower() for member in members}
              old_role = roles.get(os.environ["OLD_LEADER"])
              candidate_role = roles.get(os.environ["CANDIDATE"])
              raise SystemExit(0 if old_role in ("replica", "secondary", "sync_standby") and candidate_role in ("leader", "primary", "master") else 1)
              PY
              }

              wait_for_transition() {
                PATRONI_ENDPOINT="${endpoint}" OLD_LEADER="${old_leader}" CANDIDATE="${candidate}" python3 - <<'PY'
              import json
              import os
              import time
              import urllib.request

              deadline = time.monotonic() + 120
              while time.monotonic() < deadline:
                  try:
                      with urllib.request.urlopen(os.environ["PATRONI_ENDPOINT"] + "/cluster", timeout=5) as resp:
                          members = json.load(resp).get("members", [])
                      roles = {member.get("name"): str(member.get("role", "")).lower() for member in members}
                      if (roles.get(os.environ["OLD_LEADER"]) in ("replica", "secondary", "sync_standby") and
                              roles.get(os.environ["CANDIDATE"]) in ("leader", "primary", "master")):
                          raise SystemExit(0)
                  except (OSError, ValueError, KeyError):
                      pass
                  time.sleep(2)
              raise SystemExit("timed out waiting for Patroni role transition")
              PY
              }

              if transition_completed; then
                exit 0
              fi
              payload="$(printf '{"leader":"%s","candidate":"%s"}' "${old_leader}" "${candidate}")"
              curl -sS -XPOST "${endpoint}/switchover" -d "${payload}" || true
              wait_for_transition
      withoutCandidate:
        image: {{ include "postgresql.image.major12.minor150" . }}
        exec:
          command:
            - /bin/bash
            - -c
          args:
            - |
              set -euo pipefail
              endpoint="http://${KB_REPLICATION_PRIMARY_POD_FQDN}:8008"
              old_leader="${KB_REPLICATION_PRIMARY_POD_NAME}"

              automatic_transition_completed() {
                PATRONI_ENDPOINT="${endpoint}" OLD_LEADER="${old_leader}" python3 - <<'PY'
              import json
              import os
              import urllib.request

              with urllib.request.urlopen(os.environ["PATRONI_ENDPOINT"] + "/cluster", timeout=5) as resp:
                  members = json.load(resp).get("members", [])
              roles = {member.get("name"): str(member.get("role", "")).lower() for member in members}
              old_role = roles.get(os.environ["OLD_LEADER"])
              has_new_leader = any(name != os.environ["OLD_LEADER"] and role in ("leader", "primary", "master") for name, role in roles.items())
              raise SystemExit(0 if old_role in ("replica", "secondary", "sync_standby") and has_new_leader else 1)
              PY
              }

              if automatic_transition_completed; then
                exit 0
              fi

              candidate="$(
                PATRONI_ENDPOINT="${endpoint}" MAX_SWITCHOVER_LAG_BYTES="{{ $maxSwitchoverLagBytes }}" python3 - <<'PY'
              import json
              import os
              import urllib.request

              endpoint = os.environ["PATRONI_ENDPOINT"]
              leader = os.environ["KB_REPLICATION_PRIMARY_POD_NAME"]
              max_lag = int(os.environ["MAX_SWITCHOVER_LAG_BYTES"])
              with urllib.request.urlopen(endpoint + "/cluster", timeout=5) as resp:
                  cluster = json.load(resp)

              candidates = []
              for member in cluster.get("members", []):
                  name = member.get("name")
                  role = str(member.get("role", "")).lower()
                  state = str(member.get("state", "")).lower()
                  if not name or name == leader or state != "running":
                      continue
                  if role not in ("replica", "sync_standby", "standby_leader"):
                      continue
                  lag = member.get("lag", 0) or 0
                  try:
                      lag = int(lag)
                  except (TypeError, ValueError):
                      lag = 9223372036854775807
                  if lag > max_lag:
                      continue
                  candidates.append((lag, name))

              if not candidates:
                  raise SystemExit(f"no healthy Patroni replica candidate within {max_lag} bytes of lag")

              candidate = sorted(candidates)[0][1]
              print(candidate)
              PY
              )"
              payload="$(printf '{"leader":"%s","candidate":"%s"}' "${old_leader}" "${candidate}")"
              curl -sS -XPOST "${endpoint}/switchover" -d "${payload}" || true

              PATRONI_ENDPOINT="${endpoint}" OLD_LEADER="${old_leader}" CANDIDATE="${candidate}" python3 - <<'PY'
              import json
              import os
              import time
              import urllib.request

              deadline = time.monotonic() + 120
              while time.monotonic() < deadline:
                  try:
                      with urllib.request.urlopen(os.environ["PATRONI_ENDPOINT"] + "/cluster", timeout=5) as resp:
                          members = json.load(resp).get("members", [])
                      roles = {member.get("name"): str(member.get("role", "")).lower() for member in members}
                      if (roles.get(os.environ["OLD_LEADER"]) in ("replica", "secondary", "sync_standby") and
                              roles.get(os.environ["CANDIDATE"]) in ("leader", "primary", "master")):
                          raise SystemExit(0)
                  except (OSError, ValueError, KeyError):
                      pass
                  time.sleep(2)
              raise SystemExit("timed out waiting for Patroni role transition")
              PY
    accountProvision:
      customHandler:
        image: {{ include "postgresql.image.major12.minor150" . }}
        exec:
          command:
            - psql
          args:
            - -h$(KB_ACCOUNT_ENDPOINT)
            - -c
            - $(KB_ACCOUNT_STATEMENT)
        env:
          - name: PGUSER
            value: $(POSTGRES_USER)
          - name: PGPASSWORD
            value: $(POSTGRES_PASSWORD)
  runtime:
    securityContext:
      runAsUser: 0
      fsGroup: 103
      runAsGroup: 103
      fsGroupChangePolicy: OnRootMismatch
    initContainers:
      - name: pg-init-container
        image: {{ include "postgresql.image.major12.minor150" . }}
        imagePullPolicy: {{ default "IfNotPresent" .Values.image.pullPolicy }}
        command:
          - /kb-scripts/init_container.sh
        volumeMounts:
          - name: data
            mountPath: /home/postgres/pgdata
          - name: postgresql-config
            mountPath: /home/postgres/conf
          - name: scripts
            mountPath: /kb-scripts
          - name: pod-info
            mountPath: /kb-podinfo
    containers:
      - name: postgresql
        image: {{ include "postgresql.image.major12.minor150" . }}
        imagePullPolicy: {{ default "IfNotPresent" .Values.image.pullPolicy }}
        securityContext:
          runAsUser: 0
        command:
          - /kb-scripts/setup.sh
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 10
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
          exec:
            command:
              - /bin/sh
              - -c
              - -ee
              - |
                exec pg_isready -U {{ default "postgres" | quote }} -h 127.0.0.1 -p 5432
                [ -f /postgresql/tmp/.initialized ] || [ -f /postgresql/.initialized ]
        volumeMounts:
          - name: dshm
            mountPath: /dev/shm
          - name: data
            mountPath: /home/postgres/pgdata
          - name: postgresql-config
            mountPath: /home/postgres/conf
          - name: scripts
            mountPath: /kb-scripts
          - name: pod-info
            mountPath: /kb-podinfo
        ports:
          - name: tcp-postgresql
            containerPort: 5432
          - name: patroni
            containerPort: 8008
        env: ## refer https://github.com/zalando/spilo/blob/master/ENVIRONMENT.rst
          - name: DCS_ENABLE_KUBERNETES_API
            value: "true"
          - name: KUBERNETES_USE_CONFIGMAPS
            value: "true"
          - name: SCOPE
            value: "$(KB_CLUSTER_NAME)-$(KB_COMP_NAME)-patroni$(KB_CLUSTER_UID_POSTFIX_8)"
          - name: KUBERNETES_SCOPE_LABEL
            value: "apps.kubeblocks.postgres.patroni/scope"
          - name: KUBERNETES_ROLE_LABEL
            value: "apps.kubeblocks.postgres.patroni/role"
          - name: KUBERNETES_LABELS
            value: '{"app.kubernetes.io/instance":"$(KB_CLUSTER_NAME)","apps.kubeblocks.io/component-name":"$(KB_COMP_NAME)"}'
          - name: RESTORE_DATA_DIR
            value: /home/postgres/pgdata/kb_restore
          - name: KB_PG_CONFIG_PATH
            value: /home/postgres/conf/postgresql.conf
          - name: SPILO_CONFIGURATION
            value: | ## https://github.com/zalando/patroni#yaml-configuration
              bootstrap:
                initdb:
                  - auth-host: md5
                  - auth-local: trust
          - name: ALLOW_NOSSL
            value: "true"
          - name: PGROOT
            value: /home/postgres/pgdata/pgroot
          - name: POD_IP
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: status.podIP
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.namespace
          - name: PGUSER_SUPERUSER
            value: $(POSTGRES_USER)
          - name: PGPASSWORD_SUPERUSER
            value: $(POSTGRES_PASSWORD)
          - name: PGUSER_ADMIN
            value: superadmin
          - name: PGPASSWORD_ADMIN
            value: $(POSTGRES_PASSWORD)
          - name: PGUSER_STANDBY
            value: standby
          - name: PGPASSWORD_STANDBY
            value: $(POSTGRES_PASSWORD)
          - name: PGUSER
            value: $(POSTGRES_USER)
          - name: PGPASSWORD
            value: $(POSTGRES_PASSWORD)
          - name: PGDATA
            value: /home/postgres/pgdata/pgroot/data
          - name: KB_ENABLE_HA
            value: "false"
      - name: pgbouncer
        image: {{ include "pgbouncer.image" . }}
        imagePullPolicy: {{ .Values.pgbouncer.image.pullPolicy | quote }}
        securityContext:
          runAsUser: 0
        ports:
          - name: tcp-pgbouncer
            containerPort: 6432
        volumeMounts:
          - name: pgbouncer-config
            mountPath: /home/pgbouncer/conf
          - name: scripts
            mountPath: /kb-scripts
        command:
          - /kb-scripts/pgbouncer_setup.sh
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 15
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
          tcpSocket:
            port: tcp-pgbouncer
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 15
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
          tcpSocket:
            port: tcp-pgbouncer
        env:
          - name: PGBOUNCER_AUTH_TYPE
            value: md5
          - name: POSTGRESQL_USERNAME
            value: $(POSTGRES_USER)
          - name: POSTGRESQL_PASSWORD
            value: $(POSTGRES_PASSWORD)
          - name: POSTGRESQL_PORT
            value: "5432"
          - name: POSTGRESQL_HOST
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: status.podIP
          - name: PGBOUNCER_PORT
            value: "6432"
          - name: PGBOUNCER_BIND_ADDRESS
            value: "0.0.0.0"
      - name: exporter
        ports:
          - name: http-metrics
            containerPort: {{ .Values.metrics.service.port }}
        image: {{ include "metrics.image" . }}
        imagePullPolicy: {{ .Values.metrics.image.pullPolicy | quote }}
        args:
          - "--extend.query-path=/opt/conf/custom-metrics.yaml"
          - "--web.listen-address=:{{ .Values.metrics.service.port }}"
          - "--log.level=info"
        env:
          - name: DATA_SOURCE_USER
            value: $(POSTGRES_USER)
          - name: DATA_SOURCE_PASS
            value: $(POSTGRES_PASSWORD)
          - name: DATA_SOURCE_URI
            value: "localhost:5432/postgres?sslmode=disable"
        volumeMounts:
          - name: postgresql-custom-metrics
            mountPath: /opt/conf
    volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          {{- with .Values.shmVolume.sizeLimit }}
          sizeLimit: {{ . }}
          {{- end }}
      - name: pod-info
        downwardAPI:
          items:
            - path: "primary-pod"
              fieldRef:
                fieldPath: metadata.annotations['rs.apps.kubeblocks.io/primary']
            - path: "component-replicas"
              fieldRef:
                fieldPath: metadata.annotations['apps.kubeblocks.io/component-replicas']
  vars:
    - name: POSTGRES_USER
      valueFrom:
        credentialVarRef:
          compDef: {{ include "polardbPostgresql.componentDefinitionName" . }}
          name: postgres
          optional: false
          username: Required
    - name: POSTGRES_PASSWORD
      valueFrom:
        credentialVarRef:
          compDef: {{ include "polardbPostgresql.componentDefinitionName" . }}
          name: postgres
          optional: false
          password: Required
