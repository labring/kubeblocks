apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "polardbPostgresql.componentResourceName" (dict "suffix" "scripts" "Values" .Values) }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
data:
  {{- include "postgresql.extend.scripts" . | nindent 2 }}
