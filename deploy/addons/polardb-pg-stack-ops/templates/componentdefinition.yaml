apiVersion: apps.kubeblocks.io/v1alpha1
kind: ComponentDefinition
metadata:
  name: {{ include "polardbPgStackOps.controlComponentDefinitionName" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{ include "polardbPgStackOps.controlComponentDefinitionName" . }}: {{ include "polardbPgStackOps.controlComponentDefinitionName" . }}
    {{- include "polardbPgStackOps.labels" . | nindent 4 }}
spec:
  provider: polardb-stack
  description: Zero-replica KubeBlocks control projection for a PolarDB Stack MPDCluster. The digest-pinned control image supplies kubectl and curl; the Stack Operator owns database workloads.
  serviceKind: polardb-pg-stack
  serviceVersion: {{ .Values.controlComponentDefinition.serviceVersion | quote }}
  runtime:
    containers:
      - name: control
        image: {{ include "polardbPgStackOps.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
