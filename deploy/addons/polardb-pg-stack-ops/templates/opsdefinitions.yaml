{{- $image := include "polardbPgStackOps.image" . -}}
{{- $compDef := include "polardbPgStackOps.controlComponentDefinitionName" . -}}
{{- $wait := .Values.ops.timeoutSeconds -}}
apiVersion: apps.kubeblocks.io/v1alpha1
kind: OpsDefinition
metadata:
  name: polardb-pg-stack-switchover
  labels:
    {{- include "polardbPgStackOps.labels" . | nindent 4 }}
spec:
  componentInfos:
    - componentDefinitionName: {{ $compDef }}
  parametersSchema:
    openAPIV3Schema:
      type: object
      required: [TARGET_INSTANCE]
      properties:
        TARGET_INSTANCE:
          type: string
          pattern: '^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$'
  actions:
    - name: switch-rw
      failurePolicy: Fail
      parameters: [TARGET_INSTANCE]
      workload:
        type: Job
        backoffLimit: 0
        podSpec:
          restartPolicy: Never
          containers:
            - name: stack-ops
              image: {{ $image }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              env:
                - name: WAIT_SECONDS
                  value: {{ $wait | quote }}
              command: [/bin/sh, -ec]
              args:
                - |
                  {{- .Files.Get "scripts/common.sh" | nindent 18 }}
                  {{- .Files.Get "scripts/switchover.sh" | nindent 18 }}
---
