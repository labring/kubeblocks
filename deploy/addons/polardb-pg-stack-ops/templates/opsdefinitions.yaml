{{- $image := include "polardbPgStackOps.image" . -}}
{{- $compDef := include "polardbPgStackOps.controlComponentDefinitionName" . -}}
{{- $wait := .Values.ops.timeoutSeconds -}}
{{- $stonithSecret := required "ops.stonithSecretName is required" .Values.ops.stonithSecretName -}}
apiVersion: apps.kubeblocks.io/v1alpha1
kind: OpsDefinition
metadata:
  name: polardb-pg-stack-switchover
  labels:
    {{- include "polardbPgStackOps.labels" . | nindent 4 }}
spec:
  componentDefinitionRefs:
    - name: {{ $compDef }}
  parametersSchema:
    openAPIV3Schema:
      type: object
      required: [TARGET_INSTANCE]
      properties:
        TARGET_INSTANCE:
          type: string
          pattern: '^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$'
  jobSpec:
    backoffLimit: 0
    template:
      spec:
        restartPolicy: Never
        containers:
          - name: stack-ops
            image: {{ $image }}
            imagePullPolicy: {{ .Values.image.pullPolicy }}
            env:
              - name: WAIT_SECONDS
                value: {{ $wait | quote }}
              # KB 0.8 injects KB_CLUSTER_NAME for Custom Ops but not the
              # operation namespace/name. The Job controller supplies job-name
              # on its Pod, which is a traceable operation identifier.
              - name: KB_OPS_NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: KB_OPS_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['job-name']
            command: [/bin/sh, -ec]
            args:
              - |
                  {{- .Files.Get "scripts/common.sh" | nindent 18 }}
                  {{- .Files.Get "scripts/switchover.sh" | nindent 18 }}
---
