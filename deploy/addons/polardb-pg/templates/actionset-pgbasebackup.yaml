apiVersion: dataprotection.kubeblocks.io/v1alpha1
kind: ActionSet
metadata:
  name: {{ include "polardbPg.resourceName" (dict "suffix" "basebackup" "Values" .Values) }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{ include "polardbPg.componentDefinitionName" . }}: {{ include "polardbPg.componentDefinitionName" . }}
    {{- include "polardbPg.labels" . | nindent 4 }}
spec:
  backupType: Full
  env:
    - name: POLARDB_PG_IMAGE
      value: {{ include "polardbPg.image" . }}
    - name: PG_BIN
      value: /u01/polardb_pg/bin
    - name: DATA_DIR
      value: {{ .Values.dataMountPath }}
  backup:
    backupData:
      image: $(POLARDB_PG_IMAGE)
      runOnTargetPodNode: false
      command:
        - /bin/bash
        - -c
        - |
          {{- .Files.Get "dataprotection/backup-info-collector.sh" | nindent 10 }}
          {{- .Files.Get "dataprotection/pg-basebackup-backup.sh" | nindent 10 }}
      syncProgress:
        enabled: true
        intervalSeconds: 5
  restore:
    prepareData:
      image: $(POLARDB_PG_IMAGE)
      command:
        - /bin/bash
        - -c
        - |
          {{- .Files.Get "dataprotection/pg-basebackup-restore.sh" | nindent 10 }}
