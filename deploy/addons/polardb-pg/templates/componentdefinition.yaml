{{- $replicationHbaCIDR := required "backup.replicationHbaCIDR is required" .Values.backup.replicationHbaCIDR -}}
{{- if not (regexMatch `^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$` $replicationHbaCIDR) -}}
{{- fail "backup.replicationHbaCIDR must be an IPv4 CIDR" -}}
{{- end -}}
{{- $replicationHbaAuthMethod := required "backup.replicationHbaAuthMethod is required" .Values.backup.replicationHbaAuthMethod -}}
{{- if not (has $replicationHbaAuthMethod (list "md5" "scram-sha-256")) -}}
{{- fail "backup.replicationHbaAuthMethod must be md5 or scram-sha-256" -}}
{{- end -}}
apiVersion: apps.kubeblocks.io/v1alpha1
kind: ComponentDefinition
metadata:
  name: {{ include "polardbPg.componentDefinitionName" . }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{ include "polardbPg.componentDefinitionName" . }}: {{ include "polardbPg.componentDefinitionName" . }}
    {{- include "polardbPg.labels" . | nindent 4 }}
spec:
  provider: kubeblocks
  description: Real PolarDB-PG {{ .Values.localInstance.engineVersion }} local-instance runtime for KubeBlocks 0.9; single-instance localfs only, not shared-storage HA.
  serviceKind: polardb-pg
  serviceVersion: {{ .Values.localInstance.serviceVersion | quote }}
  services:
    - name: postgresql
      serviceName: postgresql
      spec:
        ports:
          - name: tcp-postgresql
            port: {{ .Values.localInstance.port }}
            targetPort: tcp-postgresql
  updateStrategy: BestEffortParallel
  volumes:
    - name: data
      needSnapshot: true
  logConfigs:
    - name: running
      filePathPattern: {{ printf "%s/primary_datadir/log/*" .Values.dataMountPath }}
  systemAccounts:
    - name: postgres
      initAccount: true
      passwordGenerationPolicy:
        length: 16
        numDigits: 5
        numSymbols: 0
        letterCase: MixedCases
  runtime:
    containers:
      - name: polardb
        image: {{ include "polardbPg.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          privileged: true
          capabilities:
            add:
              - SYS_PTRACE
        ports:
          - name: tcp-postgresql
            containerPort: {{ .Values.localInstance.port }}
        env:
          - name: POLARDB_PORT
            value: {{ .Values.localInstance.port | quote }}
          - name: POLARDB_USER
            value: $(POSTGRES_USER)
          - name: POLARDB_PASSWORD
            value: $(POSTGRES_PASSWORD)
        command:
          - /bin/bash
          - -ec
          - |
            data_dir="{{ .Values.dataMountPath }}/primary_datadir"
            replica_dir="{{ .Values.dataMountPath }}/replica_datadir1"

            # The official local-instance entrypoint always starts its bundled
            # local replica. A physical base backup intentionally contains
            # only the primary data directory, so boot that recovered primary
            # directly instead of falsely treating the missing demo replica as
            # a failed recovery. Empty volumes retain the official init path.
            if [[ -f "${data_dir}/PG_VERSION" && ! -d "${replica_dir}" ]]; then
              trap '/u01/polardb_pg/bin/pg_ctl -D "${data_dir}" stop -m fast || true' EXIT INT TERM
              /u01/polardb_pg/bin/pg_ctl -D "${data_dir}" -w start -o '--cluster-name=primary'
              while true; do sleep 3600 & wait $!; done
            fi

            exec /home/postgres/docker-entrypoint.sh postgres
        lifecycle:
          postStart:
            exec:
              command:
                - /bin/bash
                - -ec
                - |
                  data_dir="{{ .Values.dataMountPath }}/primary_datadir"
                  hba_file="${data_dir}/pg_hba.conf"
                  hba_rule="host replication postgres {{ $replicationHbaCIDR }} {{ $replicationHbaAuthMethod }}"

                  # The official entrypoint creates pg_hba.conf asynchronously
                  # after this container starts. Add the rule exactly once and
                  # reload only after the primary accepts local connections.
                  for _ in $(seq 1 120); do
                    if [[ -f "${hba_file}" ]] && ! grep -Fqx "${hba_rule}" "${hba_file}"; then
                      printf '%s\n' "${hba_rule}" >> "${hba_file}"
                    fi
                    if [[ -f "${hba_file}" ]] && pg_isready -U postgres -h 127.0.0.1 -p {{ .Values.localInstance.port }} >/dev/null 2>&1; then
                      /u01/polardb_pg/bin/pg_ctl -D "${data_dir}" reload
                      exit 0
                    fi
                    sleep 1
                  done

                  echo "timed out waiting to configure PolarDB-PG replication pg_hba.conf" >&2
                  exit 1
        readinessProbe:
          exec:
            command:
              - /bin/bash
              - -ec
              - pg_isready -U postgres -h 127.0.0.1 -p {{ .Values.localInstance.port }}
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12
        livenessProbe:
          exec:
            command:
              - /bin/bash
              - -ec
              - pg_isready -U postgres -h 127.0.0.1 -p {{ .Values.localInstance.port }}
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
        volumeMounts:
          - name: data
            mountPath: {{ .Values.dataMountPath }}
  vars:
    - name: POSTGRES_USER
      valueFrom:
        credentialVarRef:
          compDef: {{ include "polardbPg.componentDefinitionName" . }}
          name: postgres
          optional: false
          username: Required
    - name: POSTGRES_PASSWORD
      valueFrom:
        credentialVarRef:
          compDef: {{ include "polardbPg.componentDefinitionName" . }}
          name: postgres
          optional: false
          password: Required
