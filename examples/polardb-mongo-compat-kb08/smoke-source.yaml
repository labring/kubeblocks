apiVersion: batch/v1
kind: Job
metadata:
  name: polardb-mongo-kb08-smoke-source
  namespace: polardb-kb08-e2e
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: mongosh
          image: docker.io/mongo:7.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: polardb-mongo-kb08-documentdb-account-ferretdb
                  key: username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: polardb-mongo-kb08-documentdb-account-ferretdb
                  key: password
          command:
            - bash
            - -lc
            - |
              set -euo pipefail
              uri="mongodb://${MONGO_USER}:${MONGO_PASSWORD}@polardb-mongo-kb08-ferretdb:27017/kbcompat?authMechanism=SCRAM-SHA-256&authSource=postgres"
              mongosh "${uri}" --quiet --eval '
                function check(condition, message) { if (!condition) { throw new Error(message); } }
                function ok(result, message) { check(result && result.ok === 1, message + ": " + JSON.stringify(result)); }
                db.matrix.drop();
                ok(db.runCommand({create: "matrix"}), "create collection");
                const inserted = db.matrix.insertMany([
                  {_id: 1, type: "alpha", qty: 2, nested: {score: 10}},
                  {_id: 2, type: "beta", qty: 5, nested: {score: 20}},
                  {_id: 3, type: "alpha", qty: 7, nested: {score: 15}}
                ]);
                check(inserted.acknowledged === true, "insertMany was not acknowledged");
                check(db.matrix.countDocuments({}) === 3, "insert count");
                check(db.matrix.updateOne({_id: 1}, {$inc: {qty: 4}, $set: {checked: true}}).modifiedCount === 1, "update");
                check(db.matrix.deleteOne({_id: 2}).deletedCount === 1, "delete");
                check(db.matrix.createIndex({type: 1, qty: -1}, {name: "type_qty"}) === "type_qty", "index");
                const found = db.matrix.find({type: "alpha"}).sort({qty: -1}).toArray();
                const agg = db.matrix.aggregate([{$match: {type: "alpha"}}, {$group: {_id: "$type", total: {$sum: "$qty"}, maxScore: {$max: "$nested.score"}}}]).toArray();
                check(found.length === 2 && found[0].qty === 7 && found[1].qty === 6, "find and sort");
                check(agg.length === 1 && agg[0].total === 13 && agg[0].maxScore === 15, "aggregation");
                ok(db.runCommand({ping: 1}), "ping");
                print(JSON.stringify({count: db.matrix.countDocuments({}), found, agg, indexes: db.matrix.getIndexes()}));
              '
