apiVersion: batch/v1
kind: Job
metadata:
  name: polardb-mongo-kb08-smoke-restore-v2
  namespace: polardb-kb08-e2e
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: mongosh
          image: docker.io/mongo:7.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: polardb-mongo-kb08-restore-v2-documentdb-account-ferretdb
                  key: username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: polardb-mongo-kb08-restore-v2-documentdb-account-ferretdb
                  key: password
          command:
            - bash
            - -lc
            - |
              set -euo pipefail
              uri="mongodb://${MONGO_USER}:${MONGO_PASSWORD}@polardb-mongo-kb08-restore-v2-ferretdb:27017/kbcompat?authMechanism=SCRAM-SHA-256&authSource=postgres"
              mongosh "${uri}" --quiet --eval '
                function check(condition, message) { if (!condition) { throw new Error(message); } }
                check(db.matrix.countDocuments({}) === 2, "restored document count");
                const found = db.matrix.find({type: "alpha"}).sort({qty: -1}).toArray();
                const agg = db.matrix.aggregate([{$match: {type: "alpha"}}, {$group: {_id: "$type", total: {$sum: "$qty"}, maxScore: {$max: "$nested.score"}}}]).toArray();
                const indexes = db.matrix.getIndexes().map(i => i.name);
                check(found.length === 2 && found[0].qty === 7 && found[1].qty === 6, "restored sorted rows");
                check(agg.length === 1 && agg[0].total === 13 && agg[0].maxScore === 15, "restored aggregation");
                check(indexes.includes("type_qty"), "restored index");
                print(JSON.stringify({count: db.matrix.countDocuments({}), found, agg, indexes}));
              '
