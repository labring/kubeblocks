apiVersion: batch/v1
kind: Job
metadata:
  generateName: polardb-pg-kb08-smoke-read-
  namespace: polardb-kb08-e2e
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          image: docker.io/postgres:17
          imagePullPolicy: IfNotPresent
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: polardb-pg-kb08-polardb-account-postgres
                  key: password
          command:
            - bash
            - -ec
            - |
              host=polardb-pg-kb08-polardb-postgresql
              until pg_isready -h "${host}" -U postgres -d postgres; do sleep 2; done
              mode=$(psql -h "${host}" -U postgres -d postgres -Atqc 'SHOW polar_deploy_mode')
              test "${mode}" = OPEN_SOURCE
              result=$(psql -h "${host}" -U postgres -d postgres -Atqc "SELECT count(*) || ':' || string_agg(payload, ',' ORDER BY id) FROM kb08_restore_check")
              test "${result}" = "2:alpha,beta-updated"
              printf 'polar_deploy_mode=%s data=%s\n' "${mode}" "${result}"
