apiVersion: v1
kind: Secret
metadata:
  name: polardb-pg-stonith
  namespace: polardb-stack-demo
type: Opaque
stringData:
  # The provider must return HTTP 2xx only after physical fencing is confirmed.
  # It should power off the node, isolate the node network, or revoke storage
  # write access for targetInstance. Do not use a webhook that merely queues a
  # request and returns before confirmation.
  endpoint: https://REPLACE_STONITH_PROVIDER/fence
  token: REPLACE_LONG_LIVED_TOKEN
