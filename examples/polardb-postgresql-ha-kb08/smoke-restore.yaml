apiVersion: batch/v1
kind: Job
metadata:
  name: pg-ha-smoke-restore
  namespace: polardb-pg-ha-kb08
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          image: docker.io/postgres:17
          imagePullPolicy: IfNotPresent
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-ha-restore-postgresql-account-postgres
                  key: password
          command: [bash, -ec]
          args:
            - |
              host=pg-ha-restore-postgresql-postgresql
              until pg_isready -h "${host}" -U postgres -d postgres; do sleep 2; done
              result="$(psql -h "${host}" -U postgres -d postgres -Atqc "SELECT count(*) || ':' || string_agg(payload, ',' ORDER BY id) FROM patroni_ha_check")"
              test "${result}" = "2:before-switchover,persistent-row"
              printf 'restored data=%s\n' "${result}"
