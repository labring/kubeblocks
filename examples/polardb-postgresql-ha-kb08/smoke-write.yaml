apiVersion: batch/v1
kind: Job
metadata:
  name: pg-ha-smoke-write
  namespace: polardb-pg-ha-kb08
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          image: docker.io/postgres:17
          imagePullPolicy: IfNotPresent
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-ha-postgresql-account-postgres
                  key: password
          command: [bash, -ec]
          args:
            - |
              host=pg-ha-postgresql-postgresql
              until pg_isready -h "${host}" -U postgres -d postgres; do sleep 2; done
              test "$(psql -h "${host}" -U postgres -d postgres -Atqc 'SELECT pg_is_in_recovery()')" = f
              psql -v ON_ERROR_STOP=1 -h "${host}" -U postgres -d postgres <<'SQL'
              DROP TABLE IF EXISTS patroni_ha_check;
              CREATE TABLE patroni_ha_check (
                id integer PRIMARY KEY,
                payload text NOT NULL,
                updated_at timestamptz NOT NULL DEFAULT now()
              );
              INSERT INTO patroni_ha_check (id, payload) VALUES (1, 'before-switchover'), (2, 'persistent-row');
              SQL
